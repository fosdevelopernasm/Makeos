name: Build Custom Alpine Rootfs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download alpine-make-rootfs
        run: |
          wget -q https://raw.githubusercontent.com/alpinelinux/alpine-make-rootfs/v0.8.1/alpine-make-rootfs
          chmod +x alpine-make-rootfs

      - name: Build custom rootfs with modifications
        run: |
          sudo ./alpine-make-rootfs \
            --branch v3.20 \
            --packages 'bash curl nano htop' \
            --timezone 'Europe/Moscow' \
            --script-chroot \
            alpine-mylinux-$(date +%Y%m%d).tar.gz - <<'SHELL'
              # ===== ТВОИ МОДИФИКАЦИИ ВНУТРИ ROOTFS =====
              
              # 1. Меняем hostname
              echo "mylinux" > /etc/hostname
              
              # 2. Создаём свой скрипт-приветствие
              cat > /etc/profile.d/mylinux.sh <<'EOF'
          echo "========================================="
          echo "  Добро пожаловать в MyLinux (Alpine)"
          echo "  Команды: help echo time calc note"
          echo "========================================="
          EOF
              chmod +x /etc/profile.d/mylinux.sh
              
              # 3. Кладём кастомный скрипт с командами
              cat > /usr/local/bin/mini <<'EOF'
          #!/bin/bash
          case "$1" in
            help)   echo "Команды: help echo time calc note exit reboot" ;;
            echo)   shift; echo "$@" ;;
            time)   date '+%Y-%m-%d %H:%M:%S %Z' ;;
            calc)   shift; echo $(( $@ )) ;;
            note)   echo "$(date) - $2" >> /var/log/notes.log; echo "OK" ;;
            exit)   exit 0 ;;
            reboot) echo "Перезагрузка... (в chroot недоступна)" ;;
            *)      echo "Неизвестно: $1 (введи: mini help)" ;;
          esac
          EOF
              chmod +x /usr/local/bin/mini
              
              # 4. Добавляем алиас для mini в /etc/profile
              echo "alias mini='/usr/local/bin/mini'" >> /etc/profile
              
              # 5. Создаём пустой лог для заметок
              touch /var/log/notes.log
          SHELL

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-mylinux-rootfs
          path: alpine-mylinux-*.tar.gz
