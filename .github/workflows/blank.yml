name: Build Custom Alpine ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Alpine Linux
        uses: jirutka/setup-alpine@v1
        with:
          branch: v3.20

      - name: Install tools & build ISO
        shell: alpine.sh --root {0}
        run: |
          # 1. Установка зависимостей
          apk add --no-cache alpine-sdk alpine-conf syslinux xorriso squashfs-tools grub doas git bash

          # 2. Настройка прав root
          echo "permit nopass root" > /etc/doas.conf

          # 3. Генерация ключей подписи (обязательно)
          abuild-keygen -i -a -n -q

          # 4. Клонирование aports (содержит скрипты mkimage)
          git clone --depth=1 https://gitlab.alpinelinux.org/alpine/aports.git /aports
          cd /aports
          doas apk update

          # 5. Создание собственного профиля (можно менять пакеты здесь)
          cat > scripts/mkimg.mylinux.sh << 'EOF'
          profile_mylinux() {
              profile_standard
              kernel_cmdline="console=tty0 console=ttyS0,115200"
              syslinux_serial="0 115200"
              apks="$apks bash nano curl wget htop"
          }
          EOF
          chmod +x scripts/mkimg.mylinux.sh

          # 6. Подготовка выходной директории
          mkdir -p /out
          export TMPDIR=/tmp

          # 7. Запуск сборки ISO
          sh scripts/mkimage.sh \
            --tag v3.20 \
            --outdir /out \
            --arch x86_64 \
            --repository https://dl-cdn.alpinelinux.org/alpine/v3.20/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/v3.20/community \
            --profile mylinux

          # 8. Проверка
          ls -lh /out/

          # 9. Копирование в директорию, доступную хосту
          mkdir -p /home/runner/alpine-iso
          cp /out/*.iso /home/runner/alpine-iso/ || true

      - name: Verify ISO exists on host
        run: |
          ls -lh /home/runner/alpine-iso/
          test -n "$(ls -A /home/runner/alpine-iso/*.iso 2>/dev/null)" || { echo "ISO not found"; exit 1; }

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-mylinux-iso
          path: /home/runner/alpine-iso/*.iso
          retention-days: 7
