name: Build ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            isolinux \
            syslinux-utils \
            rsync \
            wget \
            ca-certificates

      - name: Build rootfs
        run: |
          sudo debootstrap --arch=amd64 --variant=minbase --no-check-gpg bionic rootfs http://old-releases.ubuntu.com/ubuntu/
          sudo chroot rootfs /bin/bash -c "sed -i 's/archive.ubuntu.com/old-releases.ubuntu.com/g; s/security.ubuntu.com/old-releases.ubuntu.com/g' /etc/apt/sources.list && apt-get update && apt-get install -y --no-install-recommends linux-image-generic casper lupin-casper discover laptop-detect os-prober network-manager net-tools wireless-tools locales console-setup ubiquity ubiquity-casper && apt-get clean"
          sudo rm -rf rootfs/var/lib/apt/lists/*

      - name: Configure branding
        run: |
          sudo tee rootfs/etc/lsb-release > /dev/null <<'EOF'
          DISTRIB_ID=CodeLinux
          DISTRIB_RELEASE=0.1a
          DISTRIB_CODENAME=codelinux
          DISTRIB_DESCRIPTION="Code Linux 0.1a"
          EOF
          sudo tee rootfs/etc/os-release > /dev/null <<'EOF'
          NAME="Code Linux"
          VERSION="0.1a"
          ID=codelinux
          ID_LIKE=ubuntu
          PRETTY_NAME="Code Linux 0.1a"
          VERSION_ID="0.1a"
          HOME_URL="https://github.com/"
          EOF

      - name: Configure ISO layout
        run: |
          mkdir -p image/casper image/boot/grub image/isolinux
          sudo cp -a rootfs/. image/
          sudo mksquashfs image image/casper/filesystem.squashfs -noappend -comp xz
          sudo rm -rf image/var/lib/apt/lists image/tmp/* image/var/tmp/*
          sudo du -sx --block-size=1 image | cut -f1 | sudo tee image/casper/filesystem.size > /dev/null

      - name: Install kernel and initrd
        run: |
          KERNEL=$(ls image/boot/vmlinuz-* | head -n1)
          INITRD=$(ls image/boot/initrd.img-* | head -n1)
          cp "$KERNEL" image/casper/vmlinuz
          cp "$INITRD" image/casper/initrd

      - name: Configure GRUB
        run: |
          cat > image/boot/grub/grub.cfg <<'EOF'
          set default=0
          set timeout=10
          menuentry "Code Linux 0.1a — Live" {
            linux /casper/vmlinuz boot=casper quiet splash ---
            initrd /casper/initrd
          }
          menuentry "Code Linux 0.1a — Live (safe graphics)" {
            linux /casper/vmlinuz boot=casper nomodeset quiet splash ---
            initrd /casper/initrd
          }
          menuentry "Code Linux 0.1a — Live (verbose)" {
            linux /casper/vmlinuz boot=casper ---
            initrd /casper/initrd
          }
          menuentry "Code Linux 0.1a — Live (no splash)" {
            linux /casper/vmlinuz boot=casper noplymouth ---
            initrd /casper/initrd
          }
          menuentry "Code Linux 0.1a — Live (persistent)" {
            linux /casper/vmlinuz boot=casper persistent quiet splash ---
            initrd /casper/initrd
          }
          menuentry "Code Linux 0.1a — Live to RAM" {
            linux /casper/vmlinuz boot=casper toram quiet splash ---
            initrd /casper/initrd
          }
          menuentry "Code Linux 0.1a — Install" {
            linux /casper/vmlinuz boot=casper only-ubiquity quiet splash ---
            initrd /casper/initrd
          }
          EOF

      - name: Configure isolinux
        run: |
          cp /usr/lib/ISOLINUX/isolinux.bin image/isolinux/
          cp /usr/lib/syslinux/modules/bios/ldlinux.c32 image/isolinux/
          cp /usr/lib/syslinux/modules/bios/menu.c32 image/isolinux/
          cat > image/isolinux/isolinux.cfg <<'EOF'
          DEFAULT live
          PROMPT 0
          TIMEOUT 100
          UI menu.c32
          MENU TITLE Code Linux 0.1a

          LABEL live
            MENU LABEL Live
            LINUX /casper/vmlinuz
            INITRD /casper/initrd
            APPEND boot=casper quiet splash ---

          LABEL safe
            MENU LABEL Live (safe graphics)
            LINUX /casper/vmlinuz
            INITRD /casper/initrd
            APPEND boot=casper nomodeset quiet splash ---

          LABEL verbose
            MENU LABEL Live (verbose)
            LINUX /casper/vmlinuz
            INITRD /casper/initrd
            APPEND boot=casper ---

          LABEL nosplash
            MENU LABEL Live (no splash)
            LINUX /casper/vmlinuz
            INITRD /casper/initrd
            APPEND boot=casper noplymouth ---

          LABEL persistent
            MENU LABEL Live (persistent)
            LINUX /casper/vmlinuz
            INITRD /casper/initrd
            APPEND boot=casper persistent quiet splash ---

          LABEL toram
            MENU LABEL Live to RAM
            LINUX /casper/vmlinuz
            INITRD /casper/initrd
            APPEND boot=casper toram quiet splash ---

          LABEL install
            MENU LABEL Install
            LINUX /casper/vmlinuz
            INITRD /casper/initrd
            APPEND boot=casper only-ubiquity quiet splash ---
          EOF

      - name: Create ISO
        run: |
          xorriso -as mkisofs \
            -o code-linux-0.1a.iso \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -c isolinux/boot.cat \
            -b isolinux/isolinux.bin \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            image

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: code-linux-0.1a
          path: code-linux-0.1a.iso
          retention-days: 7
