name: DenTech Android Emulator Alpha 0.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DenTech Emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Limbo 6.0.1
        uses: actions/checkout@v4
        with:
          repository: limboemu/limbo
          ref: v6.0.1-LimboEmulator
          path: limbo

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Исправлено: v4 и пустой список пакетов.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;23.1.7779620"

          sdkmanager --list_installed

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git make autoconf automake \
            libtool libtool-bin libltdl-dev \
            pkg-config flex bison gettext \
            texinfo rsync python3 binutils \
            patch wget curl unzip xz-utils \
            build-essential g++-multilib \
            ninja-build

      - name: Download QEMU dependencies
        shell: bash
        run: |
          set -e
          cd /tmp

          curl -fL --retry 5 \
            https://download.qemu.org/qemu-5.1.0.tar.xz \
            -o qemu.tar.xz
          tar -xf qemu.tar.xz

          curl -fL --retry 5 \
            https://download.gnome.org/sources/glib/2.56/glib-2.56.1.tar.xz \
            -o glib.tar.xz
          tar -xf glib.tar.xz

          curl -fL --retry 5 \
            https://sourceware.org/pub/libffi/libffi-3.3.tar.gz \
            -o libffi.tar.gz
          tar -xzf libffi.tar.gz

          curl -fL --retry 5 \
            https://www.cairographics.org/releases/pixman-0.40.0.tar.gz \
            -o pixman.tar.gz
          tar -xzf pixman.tar.gz

          curl -fL --retry 5 \
            https://www.libsdl.org/release/SDL2-2.0.8.tar.gz \
            -o SDL2.tar.gz
          tar -xzf SDL2.tar.gz

          J="$GITHUB_WORKSPACE/limbo/limbo-android-lib/src/main/jni"

          cp -a qemu-5.1.0 "$J/qemu"
          cp -a glib-2.56.1 "$J/glib"
          cp -a libffi-3.3 "$J/libffi"
          cp -a pixman-0.40.0 "$J/pixman"
          cp -a SDL2-2.0.8 "$J/SDL2"

      - name: Apply Limbo patches
        run: |
          cd limbo/limbo-android-lib/src/main/jni

          patch -d qemu -p1 < patches/qemu-5.1.0.patch
          patch -d glib -p1 < patches/glib-2.56.1.patch
          patch -d SDL2 -p1 < patches/sdl2-2.0.8.patch

      - name: Build real QEMU for ARM64
        shell: bash
        run: |
          set -e

          cd limbo/limbo-android-lib/src/main/jni

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export NDK_ROOT="$ANDROID_HOME/ndk/23.1.7779620"
          export NDK_TOOLCHAIN_VERSION=clang
          export NDK_ENV=linux-x86_64

          export BUILD_HOST=arm64-v8a
          export BUILD_GUEST=x86_64-softmmu
          export BUILD_THREADS=2

          export USE_QEMU_VERSION=5.1.0
          export USE_GCC=false

          test -d "$NDK_ROOT"

          make limbo

      # Интеграция с реальными методами Limbo 6.0.1.
      - name: Add DenTech first-run Android setup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("limbo")

          gradle = root / "limbo-android-x86/build.gradle"
          manifest = root / "limbo-android-x86/src/main/AndroidManifest.xml"
          java = root / "limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboActivity.java"

          # Application ID
          g = gradle.read_text()
          old = 'applicationId "com.limbo.emu.main"'

          if old not in g:
              raise SystemExit("Cannot find original applicationId")

          g = g.replace(
              old,
              'applicationId "com.dentech.android_emulator"',
              1
          )
          gradle.write_text(g)

          # Manifest: internet permission and app label
          m = manifest.read_text()

          if 'android.permission.INTERNET' not in m:
              m = m.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET" />\n'
                  '<application',
                  1
              )

          m = m.replace(
              'android:label="Limbo x86 PC Emulator"',
              'android:label="DenTech Android Emulator"',
              1
          )

          manifest.write_text(m)

          # Java imports
          t = java.read_text()

          if 'import java.net.HttpURLConnection;' not in t:
              t = t.replace(
                  'import java.io.IOException;',
                  'import java.io.IOException;\n'
                  'import java.io.InputStream;\n'
                  'import java.io.RandomAccessFile;\n'
                  'import java.net.HttpURLConnection;\n'
                  'import java.net.URL;',
                  1
              )

          # First launch hook
          anchor = '        addGenericOperatingSystems();'

          if anchor not in t:
              raise SystemExit("Cannot find onCreate hook")

          t = t.replace(
              anchor,
              anchor + '\n        bootstrapDenTechAndroid();',
              1
          )

          # Machine event hooks
          old_created = '''            case MachineCreated:
                  machineCreated();
                  break;'''

          new_created = '''            case MachineCreated:
                  machineCreated();
                  scheduleDenTechConfiguration(1600, 0);
                  break;'''

          if old_created not in t:
              raise SystemExit("MachineCreated hook not found")

          t = t.replace(old_created, new_created, 1)

          old_loaded = '''            case MachineLoaded:
                  loadMachine();
                  break;'''

          new_loaded = '''            case MachineLoaded:
                  loadMachine();
                  scheduleDenTechConfiguration(2600, 0);
                  break;'''

          if old_loaded not in t:
              raise SystemExit("MachineLoaded hook not found")

          t = t.replace(old_loaded, new_loaded, 1)

          # Actual Limbo API integration.
          methods = r'''
              private static final String DENTECH_VM =
                  "DenTech Android 1.6";

              private static final String DENTECH_ISO_URL =
                  "https://sourceforge.net/projects/android-x86/files/Release%201.6/android-x86-1.6.iso/download";

              private File denTechAndroidFile() {
                  File dir = getExternalFilesDir("android");

                  if (dir == null) {
                      dir = new File(getFilesDir(), "android");
                  }

                  if (!dir.exists() && !dir.mkdirs()) {
                      throw new RuntimeException("Cannot create Android folder");
                  }

                  return new File(dir, "android-x86-1.6.iso");
              }

              private boolean denTechValidISO(File file) {
                  if (!file.exists() || file.length() < 10L * 1024L * 1024L) {
                      return false;
                  }

                  try {
                      RandomAccessFile raf = new RandomAccessFile(file, "r");
                      raf.seek(0x8001);

                      byte[] signature = new byte[5];
                      raf.readFully(signature);
                      raf.close();

                      return "CD001".equals(
                          new String(signature, "US-ASCII")
                      );

                  } catch (Exception e) {
                      return false;
                  }
              }

              private void bootstrapDenTechAndroid() {
                  if (MachineController.getInstance().isRunning()) {
                      return;
                  }

                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              final File iso = denTechAndroidFile();

                              if (!denTechValidISO(iso)) {
                                  File part = new File(
                                      iso.getParentFile(),
                                      iso.getName() + ".part"
                                  );

                                  if (part.exists()) {
                                      part.delete();
                                  }

                                  runOnUiThread(new Runnable() {
                                      @Override
                                      public void run() {
                                          ToastUtils.toastLong(
                                              LimboActivity.this,
                                              "Downloading Android x86 1.6..."
                                          );
                                      }
                                  });

                                  HttpURLConnection c =
                                      (HttpURLConnection) new URL(
                                          DENTECH_ISO_URL
                                      ).openConnection();

                                  c.setConnectTimeout(30000);
                                  c.setReadTimeout(60000);
                                  c.setInstanceFollowRedirects(true);
                                  c.setRequestProperty(
                                      "User-Agent",
                                      "DenTech-Android-Emulator/0.2"
                                  );

                                  c.connect();

                                  if (c.getResponseCode() != 200) {
                                      throw new IOException(
                                          "HTTP " + c.getResponseCode()
                                      );
                                  }

                                  try (
                                      InputStream in = c.getInputStream();
                                      FileOutputStream out =
                                          new FileOutputStream(part)
                                  ) {
                                      byte[] buffer = new byte[65536];
                                      int count;

                                      while ((count = in.read(buffer)) != -1) {
                                          out.write(buffer, 0, count);
                                      }

                                      out.getFD().sync();

                                  } finally {
                                      c.disconnect();
                                  }

                                  if (!denTechValidISO(part)) {
                                      part.delete();
                                      throw new IOException(
                                          "Downloaded file is not a valid ISO"
                                      );
                                  }

                                  if (iso.exists() && !iso.delete()) {
                                      throw new IOException(
                                          "Cannot replace old ISO"
                                      );
                                  }

                                  if (!part.renameTo(iso)) {
                                      throw new IOException(
                                          "Cannot save ISO"
                                      );
                                  }
                              }

                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      openDenTechVM();
                                  }
                              });

                          } catch (final Exception e) {
                              Log.e("DenTech", "Android setup failed", e);

                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      ToastUtils.toastLong(
                                          LimboActivity.this,
                                          "Android download error: " +
                                          e.getMessage()
                                      );
                                  }
                              });
                          }
                      }
                  }).start();
              }

              private void openDenTechVM() {
                  if (MachineController.getInstance().isRunning()) {
                      return;
                  }

                  if (getMachine() != null &&
                      DENTECH_VM.equals(getMachine().getName())) {
                      scheduleDenTechConfiguration(500, 0);
                      return;
                  }

                  ArrayList<String> saved =
                      MachineController.getInstance().getStoredMachines();

                  if (saved.contains(DENTECH_VM)) {
                      setUserPressed(false);
                      machineLoaded = true;
                      notifyAction(MachineAction.LOAD_VM, DENTECH_VM);
                  } else {
                      createMachine(DENTECH_VM);
                  }
              }

              private void scheduleDenTechConfiguration(
                  final long delay,
                  final int attempt
              ) {
                  new Handler(Looper.getMainLooper()).postDelayed(
                      new Runnable() {
                          @Override
                          public void run() {
                              if (getMachine() == null ||
                                  !DENTECH_VM.equals(getMachine().getName())) {

                                  if (attempt < 12) {
                                      scheduleDenTechConfiguration(
                                          700,
                                          attempt + 1
                                      );
                                  }
                                  return;
                              }

                              configureDenTechAndroid();
                          }
                      },
                      delay
                  );
              }

              private void configureDenTechAndroid() {
                  File iso = denTechAndroidFile();

                  if (!denTechValidISO(iso) || getMachine() == null) {
                      return;
                  }

                  String path = iso.getAbsolutePath();

                  // Add ISO to Limbo's removable disk list.
                  updateDrive(FileType.CDROM, path);

                  // Save CD-ROM path in this dedicated VM.
                  notifyFieldChange(
                      MachineProperty.REMOVABLE_DRIVE,
                      new Object[] {
                          MachineProperty.CDROM,
                          path
                      }
                  );

                  // Enable CD-ROM.
                  notifyFieldChange(
                      MachineProperty.DRIVE_ENABLED,
                      new Object[] {
                          MachineProperty.CDROM,
                          true
                      }
                  );

                  // Boot from CD-ROM.
                  notifyFieldChange(
                      MachineProperty.BOOT_CONFIG,
                      "CDROM"
                  );

                  mCDenable.setChecked(true);

                  ToastUtils.toastLong(
                      LimboActivity.this,
                      "Android 1.6 is ready. Press START."
                  );
              }
          '''

          anchor = '    private void setupAppEnvironment() {'

          if anchor not in t:
              raise SystemExit("Cannot find Java insertion point")

          if 'bootstrapDenTechAndroid()' not in t:
              raise SystemExit("Bootstrap hook missing")

          t = t.replace(anchor, methods + '\n' + anchor, 1)

          java.write_text(t)

          print("DenTech integration added successfully")
          PY

      - name: Verify source integration
        run: |
          grep -q 'com.dentech.android_emulator' \
            limbo/limbo-android-x86/build.gradle

          grep -q 'bootstrapDenTechAndroid' \
            limbo/limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboActivity.java

          grep -q 'configureDenTechAndroid' \
            limbo/limbo-android-lib/src/main/java/com/max2idea/android/limbo/main/LimboActivity.java

          grep -q 'android.permission.INTERNET' \
            limbo/limbo-android-x86/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd limbo

          chmod +x gradlew

          ./gradlew \
            :limbo-android-x86:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK=$(find limbo/limbo-android-x86/build/outputs/apk \
            -type f -name "*.apk" | head -n 1)

          test -n "$APK"
          test -f "$APK"

          unzip -l "$APK" > output/apk_contents.txt

          grep -q 'libqemu-system-x86_64.so' \
            output/apk_contents.txt

          cp "$APK" \
            output/DenTech-Android-Emulator-Alpha-0.2.apk

          sha256sum output/*.apk > output/SHA256SUMS.txt

      - name: Upload Alpha 0.2
        uses: actions/upload-artifact@v4
        with:
          name: DenTech-Android-Emulator-Alpha-0.2
          path: |
            output/DenTech-Android-Emulator-Alpha-0.2.apk
            output/apk_contents.txt
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
