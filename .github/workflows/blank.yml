name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm gcc g++ grub-pc-bin grub-common xorriso mtools

      - name: Write sources
        run: |
          cat > boot.asm <<'EOF'
          bits 32
          section .multiboot
          align 4
              dd 0x1BADB002
              dd 0x00000003
              dd -(0x1BADB002 + 0x00000003)

          section .bss
          align 16
          stack_bottom:
              resb 16384
          stack_top:

          section .text
          global _start
          extern kmain
          _start:
              mov esp, stack_top
              push ebx
              push eax
              call kmain
          .hang:
              cli
              hlt
              jmp .hang
          EOF

          cat > linker.ld <<'EOF'
          ENTRY(_start)
          SECTIONS
          {
              . = 1M;
              .multiboot : { *(.multiboot) }
              .text : { *(.text) }
              .rodata : { *(.rodata) }
              .data : { *(.data) }
              .bss : { *(COMMON) *(.bss) }
          }
          EOF

          cat > kernel.c <<'EOF'
          #include <stdint.h>

          #define VGA ((volatile uint16_t*)0xB8000)
          #define W 80
          #define H 25

          static int cx = 0, cy = 0;
          static uint8_t color = 0x0F;

          static inline void outb(uint16_t p, uint8_t v) { __asm__ volatile("outb %0,%1"::"a"(v),"Nd"(p)); }
          static inline uint8_t inb(uint16_t p) { uint8_t r; __asm__ volatile("inb %1,%0":"=a"(r):"Nd"(p)); return r; }

          void clear_screen(void) {
              for (int i = 0; i < W*H; i++) VGA[i] = (color<<8)|' ';
              cx = cy = 0;
          }

          void put_char(char c) {
              if (c == '\n') { cx = 0; cy++; }
              else {
                  VGA[cy*W+cx] = (color<<8)|(uint8_t)c;
                  if (++cx >= W) { cx = 0; cy++; }
              }
              if (cy >= H) {
                  for (int i = 0; i < W*(H-1); i++) VGA[i] = VGA[i+W];
                  for (int i = W*(H-1); i < W*H; i++) VGA[i] = (color<<8)|' ';
                  cy = H-1;
              }
          }

          void puts(const char* s) { while (*s) put_char(*s++); }

          void kmain(uint32_t magic, uint32_t* mbi) {
              (void)magic; (void)mbi;
              clear_screen();
              puts("Booting...\n");
              gui_main();
              for (;;) __asm__ volatile("hlt");
          }
          EOF

          cat > gui.cpp <<'EOF'
          #include <stdint.h>

          extern "C" {
              void clear_screen(void);
              void put_char(char);
              void puts(const char*);
          }

          #define VGA ((volatile uint16_t*)0xB8000)
          #define W 80
          #define H 25

          static inline void outb(uint16_t p, uint8_t v) { __asm__ volatile("outb %0,%1"::"a"(v),"Nd"(p)); }
          static inline uint8_t inb(uint16_t p) { uint8_t r; __asm__ volatile("inb %1,%0":"=a"(r):"Nd"(p)); return r; }

          static void vga_cell(int x, int y, char c, uint8_t col) {
              if (x < 0 || x >= W || y < 0 || y >= H) return;
              VGA[y*W+x] = (col<<8)|(uint8_t)c;
          }

          static void fill_rect(int x, int y, int w, int h, char c, uint8_t col) {
              for (int j = 0; j < h; j++)
                  for (int i = 0; i < w; i++)
                      vga_cell(x+i, y+j, c, col);
          }

          static void draw_text(int x, int y, const char* s, uint8_t col) {
              while (*s) { vga_cell(x++, y, *s++, col); }
          }

          static int mouse_x = 40, mouse_y = 12;
          static bool mouse_visible = false;
          static int prev_mx = 40, prev_my = 12;

          static void mouse_wait(uint8_t type) {
              int t = 100000;
              if (type == 0) { while (t-- && (inb(0x64) & 1)) {} }
              else { while (t-- && !(inb(0x64) & 2)) {} }
          }

          static void mouse_write(uint8_t v) {
              mouse_wait(1); outb(0x64, 0x60);
              mouse_wait(1); outb(0x60, v);
          }

          static uint8_t mouse_read(void) {
              mouse_wait(0); return inb(0x60);
          }

          static uint8_t mouse_cycle = 0;
          static uint8_t mouse_byte[3];

          static void mouse_init(void) {
              mouse_wait(1); outb(0x64, 0xA8);
              mouse_wait(1); outb(0x64, 0x20);
              mouse_wait(0);
              uint8_t status = inb(0x60) | 2;
              mouse_wait(1); outb(0x64, 0x60);
              mouse_wait(1); outb(0x60, status);
              mouse_write(0xF6); mouse_read();
              mouse_write(0xF4); mouse_read();
              mouse_cycle = 0;
          }

          static void mouse_poll(void) {
              while (inb(0x64) & 1) {
                  uint8_t st = inb(0x64);
                  if (!(st & 0x20)) { inb(0x60); continue; }
                  uint8_t b = inb(0x60);
                  if (mouse_cycle == 0 && !(b & 0x08)) continue;
                  mouse_byte[mouse_cycle++] = b;
                  if (mouse_cycle == 3) {
                      mouse_cycle = 0;
                      int dx = (int8_t)mouse_byte[1];
                      int dy = -(int8_t)mouse_byte[2];
                      mouse_x += dx;
                      mouse_y += dy;
                      if (mouse_x < 0) mouse_x = 0;
                      if (mouse_x >= W) mouse_x = W-1;
                      if (mouse_y < 0) mouse_y = 0;
                      if (mouse_y >= H) mouse_y = H-1;
                  }
              }
          }

          static bool start_clicked(int mx, int my) {
              return mx >= 1 && mx <= 8 && my >= 0 && my <= 0;
          }

          static bool close_clicked(int mx, int my) {
              return mx >= 60 && mx <= 78 && my >= 2 && my <= 3;
          }

          static void redraw(bool app_open) {
              fill_rect(0, 0, W, H, ' ', 0x1F);
              fill_rect(0, 0, W, 1, ' ', 0x70);
              draw_text(1, 0, "[ Start ]", 0x70);

              fill_rect(2, 2, 18, 2, ' ', 0x17);
              draw_text(3, 2, "Hello World", 0x1F);

              fill_rect(2, 22, W-4, 2, ' ', 0x1F);
              draw_text(3, 22, "Desktop", 0x1F);

              if (app_open) {
                  fill_rect(20, 4, 40, 12, ' ', 0x07);
                  fill_rect(20, 4, 40, 1, ' ', 0x70);
                  draw_text(21, 4, "Hello World Program", 0x70);
                  draw_text(21, 6, "Hello, World!", 0x07);
                  fill_rect(58, 4, 2, 1, ' ', 0x4F);
                  draw_text(58, 4, "X", 0x4F);
                  fill_rect(22, 13, 14, 2, ' ', 0x70);
                  draw_text(24, 13, "Close", 0x70);
              }

              if (mouse_visible)
                  vga_cell(prev_mx, prev_my, ' ', app_open ? 0x07 : 0x1F);

              vga_cell(mouse_x, mouse_y, '#', 0x0F);
              prev_mx = mouse_x; prev_my = mouse_y;
              mouse_visible = true;
          }

          static uint8_t prev_buttons = 0;
          static bool app_open = false;

          extern "C" void gui_main(void) {
              mouse_init();
              redraw(app_open);
              for (;;) {
                  mouse_poll();
                  uint8_t btn = mouse_byte[0] & 1;
                  if (btn && !prev_buttons) {
                      if (!app_open && start_clicked(mouse_x, mouse_y)) { app_open = true; redraw(app_open); }
                      else if (app_open && close_clicked(mouse_x, mouse_y)) { app_open = false; redraw(app_open); }
                      else if (app_open && mouse_x >= 58 && mouse_x <= 59 && mouse_y == 4) { app_open = false; redraw(app_open); }
                      else if (app_open && mouse_x >= 22 && mouse_x <= 35 && mouse_y >= 13 && mouse_y <= 14) { app_open = false; redraw(app_open); }
                      else if (!app_open && mouse_x >= 2 && mouse_x <= 19 && mouse_y >= 2 && mouse_y <= 3) { app_open = true; redraw(app_open); }
                  }
                  prev_buttons = btn;
                  if (!btn) redraw(app_open);
                  for (volatile int i = 0; i < 50000; i++);
              }
          }
          EOF

          cat > grub.cfg <<'EOF'
          set timeout=0
          set default=0
          menuentry "MyOS" {
              multiboot /boot/kernel.elf
              boot
          }
          EOF

      - name: Compile
        run: |
          nasm -f elf32 boot.asm -o boot.o
          gcc -m32 -ffreestanding -fno-pie -fno-stack-protector -c kernel.c -o kernel.o
          g++ -m32 -ffreestanding -fno-pie -fno-stack-protector -fno-exceptions -fno-rtti -c gui.cpp -o gui.o
          ld -m elf_i386 -T linker.ld -o kernel.elf boot.o kernel.o gui.o

      - name: ISO
        run: |
          mkdir -p iso/boot/grub
          cp kernel.elf iso/boot/
          cp grub.cfg iso/boot/grub/
          grub-mkrescue -o os.iso iso

      - uses: actions/upload-artifact@v4
        with:
          name: os-iso
          path: os.iso
